<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Impressum</title>

    <style>
        :root {
            --bg: #ffffff;
            --card: #f8fafc;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #2563eb;
            --border: #e2e8f0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f172a;
                --card: #1e293b;
                --text: #f8fafc;
                --muted: #94a3b8;
                --accent: #60a5fa;
                --border: #334155;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            width: 100%;
            max-width: 720px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 10px 25px rgba(0,0,0,.08);
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.1;
        }

        .subtitle {
            margin-top: .75rem;
            color: var(--muted);
            font-size: 1.1rem;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 2rem 0;
        }

        .links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .button {
            display: inline-block;
            padding: .9rem 1.3rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: .2s ease;
        }

        .button-primary {
            background: var(--accent);
            color: white;
        }

        .button-secondary {
            border: 1px solid var(--border);
            color: var(--text);
        }

        .button:hover {
            transform: translateY(-2px);
        }

        footer {
            margin-top: 2rem;
            color: var(--muted);
            font-size: .9rem;
        }
    </style>
</head>
<body>

    <main class="card">
        <h1>Impressum</h1>

        <p class="subtitle">
            Dominik Sandhöfer<br />
            Bernbacher Str. 91<br />
            90768 Fürth
        </p>

        <div class="divider"></div>

        <div class="links">
            <a class="button button-primary"
               href="mailto:domi@sandhoefer.name">
                E-Mail schreiben
            </a>
        </div>

        <footer>
            © 2026 Dominik Sandhöfer
        </footer>
    </main>

</body>
</html>
